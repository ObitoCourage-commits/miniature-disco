<html>
    <head>
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="0">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body, html { 
                width: 100%; 
                height: 100%;
                overflow: hidden;
                background: black;
            }
            #game { 
                position: fixed;
                top: 0;
                left: 0;
                width: 100%; 
                height: 100%;
            }
            #loading {
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: black;
                color: white;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: Arial, sans-serif;
                font-size: 20px;
                z-index: 9999;
            }
            #progressBar {
                width: 300px;
                height: 20px;
                background: #333;
                border-radius: 10px;
                margin-top: 20px;
                overflow: hidden;
            }
            #progressFill {
                height: 100%;
                background: #0064ff;
                width: 0%;
                transition: width 0.3s;
                border-radius: 10px;
            }
            #statusText {
                margin-top: 10px;
                font-size: 14px;
                color: #aaa;
            }
        </style>
    </head>
    <body>
        <div id="loading">
            <div id="loadingText">Loading Crash Bandicoot 2... please wait</div>
            <div id="progressBar"><div id="progressFill"></div></div>
            <div id="statusText">Starting...</div>
        </div>
        <div id="game"></div>
        <script>
        async function loadGame() {
            const parts = [
                "https://raw.githubusercontent.com/ObitoCourage-commits/miniature-disco/main/Crash%20Bandicoot%202%20-%20Cortex%20Strikes%20Back%20(USA).bin.part01",
                "https://raw.githubusercontent.com/ObitoCourage-commits/miniature-disco/main/Crash%20Bandicoot%202%20-%20Cortex%20Strikes%20Back%20(USA).bin.part02",
                "https://raw.githubusercontent.com/ObitoCourage-commits/miniature-disco/main/Crash%20Bandicoot%202%20-%20Cortex%20Strikes%20Back%20(USA).bin.part03",
                "https://raw.githubusercontent.com/ObitoCourage-commits/miniature-disco/main/Crash%20Bandicoot%202%20-%20Cortex%20Strikes%20Back%20(USA).bin.part04",
                "https://raw.githubusercontent.com/ObitoCourage-commits/miniature-disco/main/Crash%20Bandicoot%202%20-%20Cortex%20Strikes%20Back%20(USA).bin.part05",
                "https://raw.githubusercontent.com/ObitoCourage-commits/miniature-disco/main/Crash%20Bandicoot%202%20-%20Cortex%20Strikes%20Back%20(USA).bin.part06",
                "https://raw.githubusercontent.com/ObitoCourage-commits/miniature-disco/main/Crash%20Bandicoot%202%20-%20Cortex%20Strikes%20Back%20(USA).bin.part07",
                "https://raw.githubusercontent.com/ObitoCourage-commits/miniature-disco/main/Crash%20Bandicoot%202%20-%20Cortex%20Strikes%20Back%20(USA).bin.part08",
                "https://raw.githubusercontent.com/ObitoCourage-commits/miniature-disco/main/Crash%20Bandicoot%202%20-%20Cortex%20Strikes%20Back%20(USA).bin.part09",
                "https://raw.githubusercontent.com/ObitoCourage-commits/miniature-disco/main/Crash%20Bandicoot%202%20-%20Cortex%20Strikes%20Back%20(USA).bin.part10"
            ];

            try {
                const buffers = [];
                for (let i = 0; i < parts.length; i++) {
                    document.getElementById("loadingText").textContent = `Downloading part ${i + 1} of ${parts.length}...`;
                    document.getElementById("progressFill").style.width = ((i / parts.length) * 100) + "%";
                    document.getElementById("statusText").textContent = `Fetching: ${parts[i].split('/').pop()}`;
                    const response = await fetch(parts[i]);
                    if (!response.ok) throw new Error(`Part ${i+1} failed: ${response.status}`);
                    const buffer = await response.arrayBuffer();
                    document.getElementById("statusText").textContent = `Part ${i+1} done (${(buffer.byteLength / 1024 / 1024).toFixed(1)}MB)`;
                    buffers.push(buffer);
                }

                document.getElementById("loadingText").textContent = "Assembling game...";
                document.getElementById("progressFill").style.width = "100%";
                document.getElementById("statusText").textContent = "Combining parts...";

                const totalSize = buffers.reduce((sum, buf) => sum + buf.byteLength, 0);
                const combined = new Uint8Array(totalSize);
                let offset = 0;
                for (const buf of buffers) {
                    combined.set(new Uint8Array(buf), offset);
                    offset += buf.byteLength;
                }

                document.getElementById("statusText").textContent = `Total size: ${(totalSize / 1024 / 1024).toFixed(1)}MB — starting emulator...`;

                const blob = new Blob([combined], {type: "application/octet-stream"});
                document.getElementById("loading").style.display = "none";

                EJS_player = "#game";
                EJS_core = "psx";
                EJS_gameName = "Crash Bandicoot 2: Cortex Strikes Back";
                EJS_color = "#0064ff";
                EJS_startOnLoaded = true;
                EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
                EJS_loadingText = "Loading... please wait";
                EJS_gameUrl = URL.createObjectURL(blob);
                EJS_biosUrl = "https://github.com/ObitoCourage-commits/miniature-disco/releases/download/showman/SCPH1001.BIN";

                const script = document.createElement("script");
                script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
                document.body.appendChild(script);

            } catch(err) {
                document.getElementById("loadingText").textContent = "Error loading game!";
                document.getElementById("statusText").textContent = err.message;
            }
        }

        loadGame();
        </script>
    </body>
</html>
