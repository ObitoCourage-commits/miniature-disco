<html>
    <head>
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="0">
        <style>
            body, html { 
                margin: 0; 
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: black;
            }
            #game {
                width: 100vw;
                height: 100vh;
            }
            #loading {
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: black;
                color: white;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: Arial, sans-serif;
                font-size: 20px;
                z-index: 9999;
            }
            #progressBar {
                width: 300px;
                height: 20px;
                background: #333;
                border-radius: 10px;
                margin-top: 20px;
                overflow: hidden;
            }
            #progressFill {
                height: 100%;
                background: #0064ff;
                width: 0%;
                transition: width 0.3s;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
        <div id="loading">
            <div id="loadingText">Loading Crash Bandicoot 2... please wait</div>
            <div id="progressBar"><div id="progressFill"></div></div>
        </div>
        <div style="width:100vw;height:100vh;">
            <div id="game" style="width:100%;height:100%;"></div>
        </div>
